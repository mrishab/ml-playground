<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link
      rel="alternate icon"
      type="image/svg+xml"
      href="%BASE_URL%favicon.svg"
    />
    <link rel="apple-touch-icon" href="%BASE_URL%icon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#09090b"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ML Playground" />
    <meta
      name="description"
      content="ML Playground - Interactive Machine Learning in the Browser"
    />
    <title>ML Playground</title>
    <!-- Single Page Apps for GitHub Pages redirect restoration -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          var basePath = l.pathname.endsWith("/")
            ? l.pathname.slice(0, -1)
            : l.pathname;
          window.history.replaceState(null, null, basePath + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      setTimeout(function () {
        var root = document.getElementById("root");
        if (root && (!root.childNodes || root.childNodes.length === 0)) {
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;background:#09090b;color:#f4f4f5;padding:1rem;">' +
            '<div style="max-width:400px;text-align:center;background:#18181b;padding:2rem;border-radius:0.75rem;border:1px solid #27272a;box-shadow:0 10px 25px rgba(0,0,0,0.5);">' +
            '<h2 style="margin:0 0 0.5rem;font-size:1.125rem;font-weight:700;">Loading Issue Detected</h2>' +
            '<p style="margin:0 0 1.25rem;font-size:0.75rem;color:#a1a1aa;line-height:1.4;">The app could not finish loading, likely due to a stale cache or outdated service worker.</p>' +
            '<button onclick="clearRecoveryCache()" style="background:#4f46e5;color:white;border:none;padding:0.5rem 1rem;border-radius:0.5rem;font-size:0.75rem;font-weight:600;cursor:pointer;">Clear Cache &amp; Reload</button>' +
            "</div></div>";
        }
      }, 4500);
      function clearRecoveryCache() {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            for (var i = 0; i < regs.length; i++) regs[i].unregister();
          });
        }
        if ("caches" in window) {
          caches.keys().then(function (names) {
            for (var i = 0; i < names.length; i++) caches.delete(names[i]);
          });
        }
        sessionStorage.clear();
        setTimeout(function () {
          window.location.reload(true);
        }, 300);
      }
    </script>
  </body>
</html>
